; Laravel's own photo validation (PhotoController) allows images up to 10MB,
; and imageCompression.js compresses client-side to stay under AWS Lambda's
; ~10MB request payload ceiling - but the base php:8.4 image's stock defaults
; (upload_max_filesize=2M, post_max_size=8M) are far below that, so PHP was
; silently rejecting uploads before Laravel ever saw the request, surfacing
; as a raw unstyled PHP warning instead of a normal validation error.
upload_max_filesize = 10M
post_max_size = 20M
